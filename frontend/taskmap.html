<script >
    function saveMapping(button, taskName) {

    // Get the task card
    const taskCard = button.closest(".task-card");

    // Get selected employees
    const checkedEmployees =
        taskCard.querySelectorAll(
            'input[type="checkbox"]:checked'
        );

    let employees = [];

    checkedEmployees.forEach(function(employee) {
        employees.push(employee.value);
    });


    // Check if employee is selected

    if (employees.length === 0) {

        alert(
            "Please select at least one employee for " +
            taskName
        );

        return;
    }


    // Mapping object

    const mapping = {
        project:
            document.getElementById("project").value,

        task:
            taskName,

        employees:
            employees
    };


    // Store mapping in browser

    let allMappings =
        JSON.parse(
            localStorage.getItem("taskMappings")
        ) || [];


    // Remove old mapping for same task

    allMappings =
        allMappings.filter(function(item) {

            return item.task !== taskName;

        });


    // Add new mapping

    allMappings.push(mapping);


    localStorage.setItem(
        "taskMappings",
        JSON.stringify(allMappings)
    );


    // Change button

    button.innerHTML =
        '<i class="fa-solid fa-check"></i> Saved';

    button.classList.add("saved");


    alert(
        taskName +
        " mapped to:\n\n" +
        employees.join(", ")
    );

}
</script>
