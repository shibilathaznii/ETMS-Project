<h2>Project Submission</h2>

<form>

<label>Project Name</label>
<select>
    <option>Employee Task Management System</option>
    <option>Library Management System</option>
</select>

<label>Project Title</label>
<input type="text" placeholder="Enter Project Title">

<label>Submitted By</label>
<input type="text" placeholder="Manager Name">

<label>Completion Date</label>
<input type="date">

<label>Project Status</label>
<select>
    <option>Completed</option>
    <option>In Progress</option>
</select>

<label>Upload Project File</label>
<input type="file">

<label>Remarks</label>
<textarea placeholder="Enter remarks"></textarea>

<button type="submit">Submit Project</button>

</form>
